# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: puceng
  - override /model: puceng
  - override /callbacks: puceng
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["data-14400"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 300
  gradient_clip_val: 0.5

model:
  optimizer:
    lr: 0.003
  # net:
  #   firstUpdateLayers: 4
  #   secondUpdateLayers: 4
  compile: false

data:
  batch_size: 500
  num_workers: 24

logger:
  wandb:
    tags: ${tags}
    group: "puceng5k"
  aim:
    experiment: "puceng5k"
